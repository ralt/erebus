name: release

# Build the native Debian package with linux-packaging and attach it to a
# GitHub Release. Triggered by pushing a version tag (e.g. v1.2.3); can also be
# run by hand for a dry run (build artifact only, no release published).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release and upload assets

jobs:
  build:
    name: build deb
    runs-on: ubuntu-latest
    container:
      image: debian:stable
    steps:
      # build.sh installs the rest (incl. git + nodejs); we only need enough
      # for actions/checkout to run inside the minimal image. Done here rather
      # than relying on the base image shipping them.
      - name: Bootstrap checkout deps
        run: apt-get update -qq && apt-get install -y --no-install-recommends git ca-certificates nodejs

      - uses: actions/checkout@v4

      - name: Compute package version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"   # strip leading "v" from the tag
          else
            v="0.0.0"                  # manual / untagged dry run
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Build deb package
        run: ./.ci/build.sh

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: erebus-deb
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lR dist

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
