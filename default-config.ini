[erebus]

; this is the IP that erebus has on the VPN; only used in openvpn-server static-key mode
client-ip = 10.8.0.2

; if this section exists, erebus will connect and proxy to an openvpn server
[openvpn-server]

; Valid values: udp, tcp. tcp is not recommended in order to avoid
; tcp-over-tcp problem, it should only be used in environments
; blocking UDP
proto = udp

; host and port of the vpn server.
host = vpn.server
port = 1194

; the key needs to be generated with `openvpn --genkey --secret static.key` and pre-shared.
; This is currently required as erebus only supports static key mode as of now.
; Like openvpn, you can specify a direction in there or in the separate "key-direction"
; parameter. If the direction is unspecified, both openvpn-server and erebus will use the
; same key for sending and receiving. If you wish to have 2 different keys for sending and
; receiving, make sure one side uses 0 and the other uses 1.
secret = /path/to/static.key

; Valid values:
; secret = /path/to/static.key
; or:
; secret = /path/to/static.key 0
; or:
; secret = /path/to/static.key 1
; or:
; secret = /path/to/static.key
; key-direction = 0
; or:
; secret = /path/to/static.key
; key-direction = 1

; full list of case-sensitive supported ciphers: AES-128-CBC, AES-192-CBC, AES-256-CBC, ARIA-128-CBC, ARIA-192-CBC, ARIA-256-CBC, CAMELLIA-128-CBC, CAMELLIA-192-CBC, CAMELLIA-256-CBC
cipher = AES-256-CBC

; full list of case-sensitive supported digests (i.e. the algorithm used to authenticate packets, aka the HMAC key type) in order of appearance in `openvpn --show-digests`: MD5, SHA1, RIPEMD160, MD4, SHA256, SHA384, SHA512, SHA224, whirlpool, BLAKE2s256, SHA3-224, SHA3-256, SHA3-384, SHA3-512, SHAKE128, SHAKE256, SM3
auth = SHA256

; if this section exists (instead of [openvpn-server]), erebus connects to a
; strongSwan-compatible IKEv2/IPsec server. Authentication is pre-shared key
; (PSK) only for now. The crypto suite is fixed and must be enabled on the
; server: IKE aes256-sha256-modp2048, ESP aes256-sha256.
;
; Note: unlike OpenVPN, there is no client-ip here -- the server assigns our
; VPN address during the IKEv2 handshake (via a configuration payload). Because
; erebus is rootless and cannot send raw ESP, everything is UDP-encapsulated
; (NAT-T); we force this so the server floats to port 4500.
[ipsec-server]

; host of the IPsec server.
host = vpn.server

; the IKE port (UDP 500) and the NAT-T / ESP port (UDP 4500). Both default to
; the standard ports and only need setting if the server (or a NAT in front of
; it) remaps them.
; port = 500
; natt-port = 4500

; the pre-shared key, matching the server's secret.
psk = changeme

; the identity (IDi) we present to the server. Any string the server's PSK
; config accepts (e.g. an "%any" responder accepts anything). Defaults to "erebus".
; local-id = erebus

; Outbound: a local HTTP proxy that forwards into the VPN.
; If this section is omitted, no proxy is started.
[proxy-out]

; address and port the erebus HTTP proxy will listen on
address = 127.0.0.1
port = 11023

; Inbound: expose local services to VPN peers. Each entry forwards a port
; on the erebus VPN IP to a local service:
;   <label> = <vpn-port> <local-host>:<local-port>
; The example below lets VPN peers reach a local web server on 127.0.0.1:8080
; by connecting to <client-ip>:8080 over the VPN.
[proxy-in]

web = 8080 127.0.0.1:8080
