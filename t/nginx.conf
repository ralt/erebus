server {
        listen 80 default_server;
        listen [::]:80 default_server;

        # Everything is a 404
        location / {
                return 404;
        }

	location /man/ {
		autoindex on;
		alias /usr/share/man/;
	}

        # You may need this to prevent return 404 recursion.
        location = /404.html {
                internal;
        }
}
