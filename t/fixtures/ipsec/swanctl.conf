# strongSwan responder config for the erebus IPsec interop tests.
#
# A single IKEv2 PSK road-warrior connection: the client authenticates with a
# pre-shared key, is assigned a virtual IP from pool4, and the CHILD_SA grants
# access to the server's in-tunnel address 10.10.0.1 (where nginx listens).
#
# The negotiated suite matches erebus' fixed client suite:
#   IKE: aes256 / sha256 / modp2048      ESP: aes256 / sha256 (no PFS)

connections {
   rw {
      version = 2
      proposals = aes256-sha256-modp2048
      pools = pool4
      rekey_time = 0
      dpd_delay = 0
      mobike = no
      encap = yes
      local {
         auth = psk
         id = server.erebus
      }
      remote {
         auth = psk
      }
      children {
         net {
            local_ts = 10.10.0.1/32
            esp_proposals = aes256-sha256
            rekey_time = 0
         }
      }
   }
}

secrets {
   ike-erebus {
      secret = "erebustestpsk"
   }
}

pools {
   pool4 {
      addrs = 10.9.0.0/24
   }
}
